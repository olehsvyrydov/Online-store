spring:
  application:
    name: online-store

  sql:
    init:
      schema-locations: classpath:/db/schema.sql

  datasource:
    url: jdbc:h2:mem:test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=TRUE
    username: root
    password: root
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        cache:
          use-second-level-cache: true
          region:
            factory-class: org.hibernate.cache.jcache.JCacheRegionFactory
  config:
    activate:
      on-profile: